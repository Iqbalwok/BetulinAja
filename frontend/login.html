<!DOCTYPE html>
<html lang="id" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk ke Akun — BetulinAja</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔧</text></svg>">

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Custom Application CSS -->
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body class="bg-body d-flex flex-column min-vh-100">

  <!-- Wrapper Flex -->
  <div class="d-flex flex-column flex-grow-1">
    <!-- Simple Auth Header -->
    <header class="p-3 border-bottom bg-white">
      <div class="container d-flex justify-content-between align-items-center">
        <a class="navbar-brand navbar-brand-logo py-0 text-decoration-none" href="index.html">
          <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-3 p-1 shadow-sm" style="width: 32px; height: 32px;">
            <i class="bi bi-tools fs-6"></i>
          </div>
          <span>Betulin<span class="brand-highlight">Aja</span></span>
        </a>
        <div class="d-flex align-items-center gap-2">
          <button class="btn btn-outline-custom p-2 d-inline-flex align-items-center justify-content-center touch-target btn-theme-toggle" type="button" title="Ubah Tema">
            <i class="bi bi-moon-stars-fill fs-5"></i>
          </button>
          <a href="index.html" class="btn btn-outline-custom btn-sm px-3 py-1.5">
            <i class="bi bi-arrow-left me-1"></i> Beranda
          </a>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="my-auto py-5">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-12 col-md-8 col-lg-5">
            <div class="card card-custom p-4 p-sm-5 border-0 shadow-sm bg-white rounded-4">
              <div class="text-center mb-4">
                <span class="badge bg-primary-subtle text-primary px-3 py-1.5 rounded-pill fw-semibold small mb-2 d-inline-block">Portal Autentikasi Resmi</span>
                <h3 class="fw-bold text-dark mb-1">Masuk ke Akun</h3>
                <p class="text-secondary small">Masuk untuk mengakses layanan pemesanan dan dashboard Anda.</p>
              </div>

              <!-- Inline Alert for Errors / Verification Notice -->
              <div id="login-error-alert" class="alert alert-danger py-2 px-3 small border-0 d-none mb-3" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-1"></i>
                <span id="login-error-text">Email atau kata sandi salah.</span>
              </div>

              <!-- Login Form -->
              <form id="login-form">
                <div class="mb-3">
                  <label class="form-label small fw-semibold text-dark">Email atau Nomor WhatsApp</label>
                  <div class="input-group">
                    <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-person"></i></span>
                    <input type="text" id="login-input" class="form-control border-start-0" placeholder="nama@email.com atau 08xxxxxxxxxx" required autocomplete="username">
                  </div>
                </div>

                <div class="mb-3">
                  <div class="d-flex justify-content-between align-items-center mb-1">
                    <label class="form-label small fw-semibold text-dark mb-0">Kata Sandi</label>
                    <a href="forgot-password.html" class="text-decoration-none small text-primary fw-medium">Lupa Sandi?</a>
                  </div>
                  <div class="input-group">
                    <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-lock"></i></span>
                    <input type="password" id="password-input" class="form-control border-start-0 border-end-0" placeholder="Masukkan kata sandi" required autocomplete="current-password">
                    <button class="btn btn-outline-secondary border-start-0 text-muted" type="button" id="btn-toggle-pwd" onclick="togglePasswordVisibility()">
                      <i class="bi bi-eye" id="toggle-pwd-icon"></i>
                    </button>
                  </div>
                </div>

                <div class="form-check mb-4">
                  <input class="form-check-input" type="checkbox" id="remember-me" checked>
                  <label class="form-check-label text-secondary small" for="remember-me">
                    Ingat sesi saya
                  </label>
                </div>

                <button type="submit" id="btn-submit-login" class="btn btn-primary-custom w-100 py-2.5 fw-semibold shadow-sm mb-3">
                  <span id="btn-login-spinner" class="spinner-border spinner-border-sm me-2 d-none" role="status" aria-hidden="true"></span>
                  <span id="btn-login-text"><i class="bi bi-box-arrow-in-right me-1"></i> Masuk Sekarang</span>
                </button>
              </form>

              <!-- Footer link -->
              <div class="text-center pt-3 border-top">
                <span class="text-secondary small">Belum punya akun?</span>
                <a href="register.html" class="text-primary fw-semibold small text-decoration-none ms-1">Daftar Sekarang</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="p-3 text-center text-secondary small border-top bg-white">
      &copy; 2026 <strong>BetulinAja Inc.</strong> &bull; Universitas Insan Pembangunan Indonesia (UNIPI)
    </footer>
  </div>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/api/env.js" onerror="/* static fallback */"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/theme.js"></script>

  <script>
    function togglePasswordVisibility() {
      const input = document.getElementById('password-input');
      const icon = document.getElementById('toggle-pwd-icon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'bi bi-eye-slash';
      } else {
        input.type = 'password';
        icon.className = 'bi bi-eye';
      }
    }

    // Handle Form Submit
    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const login = document.getElementById('login-input').value.trim();
      const password = document.getElementById('password-input').value;

      const submitBtn = document.getElementById('btn-submit-login');
      const spinner = document.getElementById('btn-login-spinner');
      const btnText = document.getElementById('btn-login-text');
      const errAlert = document.getElementById('login-error-alert');
      const errText = document.getElementById('login-error-text');

      errAlert.classList.add('d-none');
      submitBtn.disabled = true;
      spinner.classList.remove('d-none');
      btnText.textContent = 'Memverifikasi...';

      try {
        const res = await ApiClient.post('/auth/login', {
          login: login,
          password: password,
          device_name: 'browser_web'
        });

        if (res.success && res.data?.token) {
          localStorage.setItem(CONFIG.STORAGE_KEYS.TOKEN, res.data.token);
          localStorage.setItem(CONFIG.STORAGE_KEYS.USER, JSON.stringify(res.data.user));
          localStorage.setItem(CONFIG.STORAGE_KEYS.ROLE, res.data.user.role);

          ApiClient.showToast('Login Berhasil', `Selamat datang kembali, ${res.data.user.name}!`, 'success', 2000);

          setTimeout(() => {
            const urlParams = new URLSearchParams(window.location.search);
            const returnUrl = urlParams.get('returnUrl');
            if (returnUrl) {
              window.location.href = decodeURIComponent(returnUrl);
              return;
            }

            if (res.data.user.role === 'admin') {
              window.location.href = 'admin/dashboard.html';
            } else if (res.data.user.role === 'partner') {
              window.location.href = 'partner/dashboard.html';
            } else {
              window.location.href = 'index.html';
            }
          }, 1000);
          return;
        }

        throw new Error(res.message || 'Login gagal.');

      } catch (err) {
        // Check if unverified email (needs OTP verification)
        const errData = err.data || {};
        if (errData.needs_verification || (err.message && err.message.toLowerCase().includes('verifikasi'))) {
          const targetEmail = errData.email || (login.includes('@') ? login : '');
          errAlert.className = 'alert alert-warning py-2.5 px-3 small border-0 mb-3';
          errAlert.innerHTML = `
            <div class="d-flex align-items-start gap-2">
              <i class="bi bi-shield-exclamation fs-5 flex-shrink-0 text-warning"></i>
              <div>
                <strong class="d-block">Email Belum Terverifikasi</strong>
                <span>${err.message || 'Silakan masukkan kode OTP yang telah dikirimkan ke email Anda.'}</span>
                <a href="verify-email.html?email=${encodeURIComponent(targetEmail)}" class="btn btn-sm btn-warning text-dark fw-bold mt-2 d-inline-flex align-items-center gap-1">
                  Verifikasi Sekarang <i class="bi bi-arrow-right"></i>
                </a>
              </div>
            </div>
          `;
          errAlert.classList.remove('d-none');
        } else {
          errAlert.className = 'alert alert-danger py-2 px-3 small border-0 mb-3';
          errText.textContent = err.message || 'Kredensial yang diberikan tidak cocok dengan data kami.';
          errAlert.classList.remove('d-none');
        }
      } finally {
        submitBtn.disabled = false;
        spinner.classList.add('d-none');
        btnText.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i> Masuk Sekarang';
      }
    });
  </script>
</body>
</html>
