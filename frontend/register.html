<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="description" content="Daftar Akun BetulinAja — Solusi Service &amp; Perbaikan Rumah Terpercaya.">
  <meta name="theme-color" content="#2563EB">
  <title>Daftar Akun Baru — BetulinAja</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Core App CSS -->
  <link rel="stylesheet" href="assets/css/app.css">
  <link rel="stylesheet" href="assets/css/customer.css">
</head>
<body class="bg-light">

  <div class="min-vh-100 d-flex flex-column justify-content-between">
    <!-- Header -->
    <header class="p-3 border-bottom bg-white sticky-top">
      <div class="container d-flex align-items-center justify-content-between">
        <a class="navbar-brand navbar-brand-logo py-0" href="index.html">
          <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-3 p-1 shadow-sm" style="width: 32px; height: 32px;">
            <i class="bi bi-tools fs-6"></i>
          </div>
          <span>Betulin<span class="brand-highlight">Aja</span></span>
        </a>
        <a href="login.html" class="btn btn-outline-custom btn-sm">
          <i class="bi bi-box-arrow-in-right me-1"></i> Sudah Punya Akun
        </a>
      </div>
    </header>

    <!-- Main Content -->
    <main class="my-auto py-5">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-12 col-md-9 col-lg-6">
            <div class="card card-custom p-4 p-sm-5 border-0 shadow-sm bg-white rounded-4">
              <div class="text-center mb-4">
                <span class="badge bg-primary-subtle text-primary px-3 py-1.5 rounded-pill fw-semibold small mb-2 d-inline-block">Pendaftaran Pengguna</span>
                <h3 class="fw-bold text-dark mb-1">Buat Akun Baru</h3>
                <p class="text-secondary small">Bergabunglah dengan platform perbaikan rumah terdepan.</p>
              </div>

              <!-- Role Selector -->
              <div class="d-flex bg-light p-1 rounded-3 mb-4 border">
                <button type="button" class="btn btn-sm flex-fill fw-semibold role-toggle active" id="tab-customer" onclick="selectRole('customer')">
                  <i class="bi bi-person me-1"></i> Sebagai Pelanggan
                </button>
                <button type="button" class="btn btn-sm flex-fill fw-semibold text-secondary role-toggle" id="tab-partner" onclick="selectRole('partner')">
                  <i class="bi bi-tools me-1"></i> Sebagai Mitra Teknisi
                </button>
              </div>

              <!-- Error Alert -->
              <div id="register-error-alert" class="alert alert-danger py-2 px-3 small border-0 d-none mb-3" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-1"></i>
                <span id="register-error-text">Terjadi kesalahan validasi.</span>
              </div>

              <!-- Register Form -->
              <form id="register-form">
                <input type="hidden" id="role-input" value="customer">

                <div class="mb-3">
                  <label class="form-label small fw-semibold text-dark">Nama Lengkap</label>
                  <div class="input-group">
                    <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-person-badge"></i></span>
                    <input type="text" id="name-input" class="form-control border-start-0" placeholder="contoh: Andi Pratama" required>
                  </div>
                </div>

                <div class="row g-2 mb-3">
                  <div class="col-sm-6">
                    <label class="form-label small fw-semibold text-dark">Alamat Email</label>
                    <div class="input-group">
                      <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-envelope"></i></span>
                      <input type="email" id="email-input" class="form-control border-start-0" placeholder="nama@email.com" required>
                    </div>
                  </div>
                  <div class="col-sm-6">
                    <label class="form-label small fw-semibold text-dark">Nomor WhatsApp</label>
                    <div class="input-group">
                      <span class="input-group-text bg-light text-muted border-end-0">+62</span>
                      <input type="tel" id="phone-input" class="form-control border-start-0" placeholder="812xxxxxxx" required>
                    </div>
                  </div>
                </div>

                <div class="row g-2 mb-3">
                  <div class="col-sm-6">
                    <label class="form-label small fw-semibold text-dark">Kata Sandi (Minimal 8 karakter)</label>
                    <div class="input-group">
                      <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-lock"></i></span>
                      <input type="password" id="password-input" class="form-control border-start-0" placeholder="Minimal 8 karakter" minlength="8" required>
                    </div>
                  </div>
                  <div class="col-sm-6">
                    <label class="form-label small fw-semibold text-dark">Ulangi Kata Sandi</label>
                    <div class="input-group">
                      <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-shield-lock"></i></span>
                      <input type="password" id="password-confirm-input" class="form-control border-start-0" placeholder="Ketik ulang kata sandi" minlength="8" required>
                    </div>
                  </div>
                </div>

                <!-- Partner Specific Fields (Hidden by default) -->
                <div id="partner-fields" class="p-3 bg-light rounded-3 border mb-3 d-none">
                  <h6 class="fw-bold text-dark small mb-2"><i class="bi bi-briefcase me-1 text-primary"></i> Data Keahlian Mitra Teknisi</h6>
                  
                  <div class="mb-3">
                    <label class="form-label small fw-semibold text-dark">Nomor KTP (NIK 16 Digit)</label>
                    <input type="text" id="id-card-input" class="form-control" placeholder="3171xxxxxxxxxxxx" maxlength="16">
                  </div>

                  <div class="mb-3">
                    <label class="form-label small fw-semibold text-dark">Pengalaman Kerja (Tahun)</label>
                    <input type="number" id="experience-input" class="form-control" value="2" min="0" max="40">
                  </div>

                  <div class="mb-3">
                    <label class="form-label small fw-semibold text-dark">Ringkasan Pengalaman / Spesialisasi</label>
                    <textarea id="description-input" class="form-control" rows="2" placeholder="contoh: Berpengalaman 5 tahun reparasi AC split, cuci AC, dan kelistrikan rumah tangga."></textarea>
                  </div>

                  <div>
                    <label class="form-label small fw-semibold text-dark mb-1">Kategori Spesialisasi:</label>
                    <div class="d-flex flex-wrap gap-2" id="category-checkboxes">
                      <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" name="categories" value="1" id="cat-ac" checked>
                        <label class="form-check-label small" for="cat-ac">Service AC</label>
                      </div>
                      <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" name="categories" value="2" id="cat-listrik">
                        <label class="form-check-label small" for="cat-listrik">Kelistrikan</label>
                      </div>
                      <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" name="categories" value="3" id="cat-plumbing">
                        <label class="form-check-label small" for="cat-plumbing">Plumbing</label>
                      </div>
                      <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" name="categories" value="4" id="cat-elektronik">
                        <label class="form-check-label small" for="cat-elektronik">Elektronik</label>
                      </div>
                    </div>
                  </div>
                </div>

                <div class="form-check mb-4">
                  <input class="form-check-input" type="checkbox" id="terms-agree" required checked>
                  <label class="form-check-label text-secondary small" for="terms-agree">
                    Saya menyetujui Ketentuan Layanan &amp; Kebijakan Privasi BetulinAja
                  </label>
                </div>

                <button type="submit" id="btn-submit-register" class="btn btn-primary-custom w-100 py-2.5 fw-semibold shadow-sm mb-3">
                  <span id="btn-register-spinner" class="spinner-border spinner-border-sm me-2 d-none" role="status" aria-hidden="true"></span>
                  <span id="btn-register-text"><i class="bi bi-person-plus me-1"></i> Daftar Akun Sekarang</span>
                </button>
              </form>

              <!-- Footer link -->
              <div class="text-center pt-2 border-top">
                <span class="text-secondary small">Sudah memiliki akun?</span>
                <a href="login.html" class="text-primary fw-semibold small text-decoration-none ms-1">Masuk ke Sini</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="p-3 text-center text-secondary small border-top bg-white">
      &copy; 2026 <strong>BetulinAja Inc.</strong> &bull; Universitas Insan Pembangunan Indonesia (UNIPI)
    </footer>
  </div>

  <div id="toast-container"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/theme.js"></script>

  <script>
    function selectRole(role) {
      document.getElementById('role-input').value = role;
      const tabCustomer = document.getElementById('tab-customer');
      const tabPartner = document.getElementById('tab-partner');
      const partnerFields = document.getElementById('partner-fields');

      if (role === 'partner') {
        tabPartner.classList.add('active', 'btn-primary-custom');
        tabPartner.classList.remove('text-secondary');
        tabCustomer.classList.remove('active', 'btn-primary-custom');
        tabCustomer.classList.add('text-secondary');
        partnerFields.classList.remove('d-none');
      } else {
        tabCustomer.classList.add('active', 'btn-primary-custom');
        tabCustomer.classList.remove('text-secondary');
        tabPartner.classList.remove('active', 'btn-primary-custom');
        tabPartner.classList.add('text-secondary');
        partnerFields.classList.add('d-none');
      }
    }

    document.getElementById('register-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const role = document.getElementById('role-input').value;
      const name = document.getElementById('name-input').value.trim();
      const email = document.getElementById('email-input').value.trim();
      let phone = document.getElementById('phone-input').value.trim();
      if (!phone.startsWith('0') && !phone.startsWith('62')) {
        phone = '0' + phone;
      }
      const password = document.getElementById('password-input').value;
      const passwordConfirmation = document.getElementById('password-confirm-input').value;

      const submitBtn = document.getElementById('btn-submit-register');
      const spinner = document.getElementById('btn-register-spinner');
      const btnText = document.getElementById('btn-register-text');
      const errAlert = document.getElementById('register-error-alert');
      const errText = document.getElementById('register-error-text');

      if (password !== passwordConfirmation) {
        errText.textContent = 'Konfirmasi kata sandi tidak cocok. Harap periksa kembali.';
        errAlert.classList.remove('d-none');
        return;
      }

      if (password.length < 8) {
        errText.textContent = 'Kata sandi minimal harus 8 karakter.';
        errAlert.classList.remove('d-none');
        return;
      }

      const payload = {
        name,
        email,
        phone,
        password,
        password_confirmation: passwordConfirmation,
        role
      };

      if (role === 'partner') {
        payload.id_card_number = document.getElementById('id-card-input').value.trim() || '3171000000000001';
        payload.years_experience = parseInt(document.getElementById('experience-input').value) || 1;
        payload.description = document.getElementById('description-input').value.trim() || 'Teknisi profesional siap melayani.';
        const selectedCats = Array.from(document.querySelectorAll('input[name="categories"]:checked')).map(cb => parseInt(cb.value));
        payload.category_ids = selectedCats.length > 0 ? selectedCats : [1];
      }

      const submitBtn = document.getElementById('btn-submit-register');
      const spinner = document.getElementById('btn-register-spinner');
      const btnText = document.getElementById('btn-register-text');
      const errAlert = document.getElementById('register-error-alert');
      const errText = document.getElementById('register-error-text');

      errAlert.classList.add('d-none');
      submitBtn.disabled = true;
      spinner.classList.remove('d-none');
      btnText.textContent = 'Mendaftarkan...';

      try {
        const data = await Auth.register(payload);
        ApiClient.showToast('Registrasi Berhasil', `Selamat datang, ${data.user.name}! Akun Anda telah siap.`, 'success', 2500);

        setTimeout(() => {
          if (data.user.role === 'partner') {
            window.location.href = 'partner/dashboard.html';
          } else {
            window.location.href = 'index.html';
          }
        }, 1200);

      } catch (err) {
        errAlert.classList.remove('d-none');
        errText.textContent = err.message || 'Pendaftaran gagal. Pastikan email & nomor WhatsApp belum pernah digunakan.';
        ApiClient.showToast('Registrasi Gagal', err.message, 'danger');
      } finally {
        submitBtn.disabled = false;
        spinner.classList.add('d-none');
        btnText.innerHTML = '<i class="bi bi-person-plus me-1"></i> Daftar Akun Sekarang';
      }
    });
  </script>
</body>
</html>
